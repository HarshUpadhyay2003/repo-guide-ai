version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repopilot-backend
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=sqlite:///./repo_guide.db
      - MODEL_NAME=llama-3.3-70b-versatile
      - ALLOWED_ORIGINS=http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/my-app
      dockerfile: Dockerfile
    container_name: repopilot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_REPOPILOT_VERSION=v1.0.0-beta
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
